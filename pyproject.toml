[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "obscuraflow"
version = "0.1.0"
description = "A workflow orchestration framework"
readme = "README.md"
requires-python = ">=3.7"
license = {text = "MIT"}
authors = [
    {name = "Robin Andreeklund"}
]

[project.urls]
Homepage = "https://github.com/robinandreeklund-collab/Obscuraflow"
Repository = "https://github.com/robinandreeklund-collab/Obscuraflow"
